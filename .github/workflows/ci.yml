name: Platform QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 ./tests/... ./pkg/...

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (tests run inside Dockerfile)
        run: docker build -t platform-qa:${{ github.sha }} .

  smoke-remote:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
    steps:
      - name: Smoke remote stand
        if: env.ADMIN_URL != ''
        run: |
          set -e
          echo "Smoke против удалённого стенда: $ADMIN_URL"

          curl -sf --max-time 15 "$ADMIN_URL/api/status" > /dev/null
          echo "Health-check OK"

          RUN_ID=$(curl -sf --max-time 15 -X POST "$ADMIN_URL/api/runs" \
            -H 'Content-Type: application/json' \
            -d '{"suites":["flow_a","flow_b","cancellation","idempotency","security_rbac","auth_otp","negative_sm"]}' \
            | jq -r '.id // .run_id // empty')
          echo "Запущен батч, run_id=$RUN_ID"

          sleep 60

          LAST=$(curl -sf --max-time 15 "$ADMIN_URL/api/runs" | jq 'if type == "array" then . else (.runs // .items // []) end | sort_by(.startTime // .created // "") | last')
          RUN=$(echo "$LAST" | jq -r '.id // "?"')
          STATUS=$(echo "$LAST" | jq -r '.status // "UNKNOWN"')
          FAILED=$(echo "$LAST" | jq '.failedChecks // 0')
          echo "Последний прогон: id=$RUN status=$STATUS failedChecks=$FAILED"

          if [ "$STATUS" = "RUNNING" ]; then
            echo "::error::Прогон ещё выполняется через 60с — увеличьте паузу или проверьте стенд."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ] || [ "$STATUS" = "FAILED" ]; then
            echo "::error::Smoke-прогон на удалённом стенде провален (failedChecks=$FAILED)."
            exit 1
          fi
          echo "Smoke OK"
