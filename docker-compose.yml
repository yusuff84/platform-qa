version: '3.8'

services:
  locali-e2e-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locali-e2e-platform
    ports:
      - "18080:8080"
    environment:
      - PORT=8080
      - BASE_URL=${BASE_URL:-}
      - NATS_URL=${NATS_URL:-nats://localhost:4222}
      - ADMIN_LOGIN=${ADMIN_LOGIN:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CLIENT_TOKEN=${CLIENT_TOKEN:-}
      - REST_TOKEN=${REST_TOKEN:-}
      - COURIER_TOKEN=${COURIER_TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - VERIFICATION_CODE=${VERIFICATION_CODE:-}
      - DATA_DIR=/app/data
      # Fixture settings: city and coordinates must match the supportedCities
      # of the stand's active Locali tariff, otherwise delivery is refused.
      - FIXTURE_CITY=${FIXTURE_CITY:-}
      - FIXTURE_LATITUDE=${FIXTURE_LATITUDE:-}
      - FIXTURE_LONGITUDE=${FIXTURE_LONGITUDE:-}
      - FIXTURE_COURIER_GROUP_ID=${FIXTURE_COURIER_GROUP_ID:-}
      - FIXTURE_CLIENT_PHONE=${FIXTURE_CLIENT_PHONE:-}
      - USE_TEST_PHONE=${USE_TEST_PHONE:-}
      - HTTP_DEBUG=${HTTP_DEBUG:-}
    volumes:
      - e2e-data:/app/data
      - /Users/yusuff84/Documents/all project/flutter-director/locali_director:/locali_director:ro
      - /Users/yusuff84/Documents/all project/locali-app-backend:/backend:ro
    restart: unless-stopped
    networks:
      - default
      # The local Locali backend publishes 3005 on the host loopback only, so
      # it is unreachable through host.docker.internal. Joining its compose
      # network makes it addressable as http://lokaly-back:3005.
      - locali-backend

networks:
  locali-backend:
    external: true
    name: locali-app-backend_default

volumes:
  e2e-data:
